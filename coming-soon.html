<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Coming Soon — Qemistry</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Tajawal',sans-serif;
  background:#0a0c10;
  color:#e8eaf0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
body::before {
  content:''; position:fixed; inset:0; pointer-events:none;
  background: radial-gradient(ellipse 600px 400px at 20% 10%, rgba(139,92,246,0.12), transparent 70%),
              radial-gradient(ellipse 500px 300px at 80% 80%, rgba(141,27,61,0.15), transparent 70%);
}
.card {
  background:#0f1218;
  border:1px solid rgba(255,255,255,0.12);
  border-radius:24px;
  padding:48px 40px;
  text-align:center;
  max-width:480px;
  width:100%;
  position:relative;
  z-index:1;
  animation:fadeUp .6s ease both;
}
.logo-container {
  margin:0 auto 24px;
}
h1 {
  font-size:32px; font-weight:700; margin-bottom:12px;
  background:linear-gradient(135deg,#fff 0%,#8B5CF6 60%,#AE2147 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.subtitle { font-size:16px; color:#8892a4; line-height:1.7; margin-bottom:32px; }
.badge {
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(141,27,61,.15); border:1px solid rgba(141,27,61,.3);
  border-radius:20px; padding:8px 20px; font-size:14px; color:#e08fa0;
  margin-bottom:32px;
}
.badge::before {
  content:''; width:8px; height:8px; background:#AE2147;
  border-radius:50%; box-shadow:0 0 8px #AE2147;
  animation:pulse 2s infinite;
}
.features {
  display:grid; grid-template-columns:1fr 1fr;
  gap:10px; margin-bottom:32px;
}
.feat {
  background:#1a2030; border:1px solid rgba(255,255,255,0.07);
  border-radius:12px; padding:14px 12px; text-align:center;
}
.feat-icon { font-size:20px; margin-bottom:6px; }
.feat-text { font-size:12px; color:#8892a4; }
.divider {
  border:none; border-top:1px solid rgba(255,255,255,0.07);
  margin:24px 0;
}
.location-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:#1a2030; border:1px solid rgba(255,255,255,0.07);
  border-radius:20px; padding:6px 16px; font-size:13px; color:#4a5568;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>
<body>
<div class="card">
  <div style="width:100px;height:100px;border-radius:20px;background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(141,27,61,0.1));border:1px solid rgba(139,92,246,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
    <svg viewBox="0 0 100 100" width="90" height="90" xmlns="http://www.w3.org/2000/svg" overflow="visible">
      <defs>
        <radialGradient id="ng-cs" cx="38%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#d8b4fe"/>
          <stop offset="100%" stop-color="#7c3aed"/>
        </radialGradient>
      </defs>
      <ellipse fill="none" stroke="#c084fc" stroke-width="1.2" opacity=".65" cx="50" cy="50" rx="44" ry="17" transform="rotate(-18,50,50)"/>
      <ellipse fill="none" stroke="#c084fc" stroke-width="1.2" opacity=".65" cx="50" cy="50" rx="40" ry="15" transform="rotate(55,50,50)"/>
      <ellipse fill="none" stroke="#c084fc" stroke-width="1.2" opacity=".65" cx="50" cy="50" rx="46" ry="16" transform="rotate(-80,50,50)"/>
      <circle cx="50" cy="50" r="15" fill="url(#ng-cs)"/>
      <path d="M 43 44.5 Q 45 43.3 47 44.5" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.9" stroke-linecap="round"/>
      <path d="M 53 44.5 Q 55 43.3 57 44.5" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.9" stroke-linecap="round"/>
      <circle cx="45" cy="48" r="4.2" fill="white" opacity=".93"/>
      <circle id="cs-pL" cx="45" cy="48" r="2.5" fill="#2e1065"/>
      <circle cx="55" cy="48" r="4.2" fill="white" opacity=".93"/>
      <circle id="cs-pR" cx="55" cy="48" r="2.5" fill="#2e1065"/>
      <path id="cs-mouth" d="M 45.5 57 Q 50 61 54.5 57" fill="none" stroke="white" stroke-width="1.25" stroke-linecap="round"/>
      <circle id="cs-ed1" cx="94" cy="50" r="4" fill="#e879f9" style="filter:drop-shadow(0 0 4px #e879f9)"/>
      <circle id="cs-ed2" cx="16" cy="24" r="3.4" fill="#c084fc" style="filter:drop-shadow(0 0 3px #c084fc)"/>
      <circle id="cs-ed3" cx="28" cy="82" r="2.9" fill="#a855f7" style="filter:drop-shadow(0 0 3px #a855f7)"/>
    </svg>
  </div>
  <div class="badge">🚀 Coming Soon to Your Region</div>
  <h1>Qemistry</h1>
  <p class="subtitle">A random video chat platform — we're expanding to more regions soon.</p>
  <div class="features">
    <div class="feat"><div class="feat-icon">🎯</div><div class="feat-text">Interest Filter</div></div>
    <div class="feat"><div class="feat-icon">🛡️</div><div class="feat-text">Safe Environment</div></div>
    <div class="feat"><div class="feat-icon">📹</div><div class="feat-text">Encrypted P2P Video</div></div>
    <div class="feat"><div class="feat-icon">👤</div><div class="feat-text">Verified Accounts</div></div>
  </div>
  <hr class="divider"/>
  <div class="location-badge">📍 Currently in limited access</div>
</div>
<script>
(function(){
  const orbDefs=[
    {cx:50,cy:50,rx:44,ry:17,tilt:-18*Math.PI/180},
    {cx:50,cy:50,rx:40,ry:15,tilt:55*Math.PI/180},
    {cx:50,cy:50,rx:46,ry:16,tilt:-80*Math.PI/180},
  ];
  const eDef=[{orb:0,off:0},{orb:1,off:Math.PI*.7},{orb:2,off:Math.PI*1.4}];
  const eds=['cs-ed1','cs-ed2','cs-ed3'].map(id=>document.getElementById(id));
  const pL=document.getElementById('cs-pL'),pR=document.getElementById('cs-pR'),mouth=document.getElementById('cs-mouth');
  if(!eds[0])return;
  let eyeAng=-Math.PI/2,eyeDir=1,eyeTurns=0,t=0,mClock=0;
  function ePos(o,a){const lx=o.rx*Math.cos(a),ly=o.ry*Math.sin(a);return{x:o.cx+lx*Math.cos(o.tilt)-ly*Math.sin(o.tilt),y:o.cy+lx*Math.sin(o.tilt)+ly*Math.cos(o.tilt)};}
  function frame(){
    t+=0.030;mClock+=0.030;
    eDef.forEach((e,i)=>{const p=ePos(orbDefs[e.orb],t+e.off);if(eds[i]){eds[i].setAttribute('cx',p.x);eds[i].setAttribute('cy',p.y);}});
    eyeAng+=0.028*eyeDir;eyeTurns+=0.028;
    if(eyeTurns>=Math.PI*2){eyeTurns=0;eyeDir*=-1;}
    if(pL){pL.setAttribute('cx',45+Math.cos(eyeAng)*1.7);pL.setAttribute('cy',48+Math.sin(eyeAng)*1.7);}
    if(pR){pR.setAttribute('cx',55+Math.cos(eyeAng)*1.7);pR.setAttribute('cy',48+Math.sin(eyeAng)*1.7);}
    const v=(Math.sin(mClock*0.38)+1)/2;
    const ctrlY=58.5+v*2.2,wx=4.5+v*1.5,baseY=56.8;
    if(mouth)mouth.setAttribute('d',`M ${50-wx} ${baseY} Q 50 ${ctrlY} ${50+wx} ${baseY}`);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
