<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PHDYLP1GDF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PHDYLP1GDF');
  </script>
  <link rel="icon" type="image/png" href="icon.png">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4271411908599611"
     crossorigin="anonymous"></script>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — Qemistry</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
<div style="background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:40px;width:100%;max-width:420px;text-align:center;">
  <div style="font-size:48px;margin-bottom:16px;">🔐</div>
  <h2 style="font-size:22px;font-weight:700;margin-bottom:8px;">Reset Password</h2>
  <p style="font-size:14px;color:var(--text2);margin-bottom:28px;">Enter your new password</p>

  <div id="form-section">
    <div class="field" style="text-align:left;margin-bottom:16px;">
      <label style="display:block;font-size:13px;color:var(--text2);margin-bottom:6px;">New Password</label>
      <input id="new-password" type="password" placeholder="At least 8 characters" dir="ltr"
        style="width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;outline:none;"/>
    </div>
    <div class="field" style="text-align:left;margin-bottom:24px;">
      <label style="display:block;font-size:13px;color:var(--text2);margin-bottom:6px;">Confirm Password</label>
      <input id="confirm-password" type="password" placeholder="Re-enter your password" dir="ltr"
        style="width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;outline:none;"/>
    </div>
    <button onclick="resetPassword()"
      style="width:100%;background:linear-gradient(135deg,#8D1B3D,#7C3AED);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:600;cursor:pointer;">
      Change Password
    </button>
    <p id="error-msg" style="color:#EF4444;font-size:13px;margin-top:12px;display:none;"></p>
  </div>

  <div id="success-section" style="display:none;">
    <div style="font-size:48px;margin-bottom:16px;">✅</div>
    <h3 style="font-size:18px;font-weight:700;margin-bottom:8px;">Password Changed!</h3>
    <p style="font-size:14px;color:var(--text2);margin-bottom:24px;">You can now sign in with your new password</p>
    <a href="/"
      style="display:inline-block;background:linear-gradient(135deg,#8D1B3D,#7C3AED);color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-size:15px;">
      Sign In
    </a>
  </div>
</div>

<script>
const SERVER_URL = 'https://www.qemistry.live';

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

async function resetPassword() {
  const password = document.getElementById('new-password').value.trim();
  const confirm  = document.getElementById('confirm-password').value.trim();

  if (!password || !confirm) return showError('⚠️ Please fill in all fields');
  if (password.length < 8) return showError('⚠️ Password must be at least 8 characters');
  if (!/[A-Z]/.test(password)) return showError('⚠️ Password must contain an uppercase letter');
  if (!/[0-9]/.test(password)) return showError('⚠️ Password must contain a number');
  if (password !== confirm) return showError('⚠️ Passwords do not match');

  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) return showError('⚠️ Invalid link');

  const res  = await fetch(`${SERVER_URL}/reset-password`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, password })
  });
  const data = await res.json();

  if (data.ok) {
    document.getElementById('form-section').style.display    = 'none';
    document.getElementById('success-section').style.display = 'block';
  } else {
    showError('⚠️ ' + (data.message || 'Failed to reset password'));
  }
}
</script>
</body>
</html>
