<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PHDYLP1GDF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PHDYLP1GDF');
  </script>
  <link rel="icon" type="image/png" href="icon.png">
  <script src="local-config.js"></script>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>مهامي — Qemistry</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
.tasks-page { min-height:100vh; background:var(--bg); padding:32px 20px; max-width:800px; margin:0 auto; }
.tasks-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; flex-wrap:wrap; gap:12px; }
.task-card { background:var(--bg2); border:1px solid var(--border2); border-radius:14px; padding:20px; margin-bottom:12px; }
.task-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px; }
.task-title { font-size:15px; font-weight:700; }
.task-status { font-size:12px; padding:3px 10px; border-radius:20px; white-space:nowrap; }
.task-meta { font-size:12px; color:var(--text3); margin-bottom:8px; }
.task-desc { font-size:13px; color:var(--text2); margin-bottom:12px; line-height:1.6; }
.login-overlay { position:fixed; inset:0; background:#0a0c10; display:flex; align-items:center; justify-content:center; z-index:100; }
.login-card { background:var(--bg2); border:1px solid var(--border2); border-radius:20px; padding:40px; width:100%; max-width:360px; text-align:center; }
.filter-bar { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.filter-btn { background:var(--surface); border:1px solid var(--border2); border-radius:20px; padding:6px 14px; font-family:'Tajawal',sans-serif; font-size:13px; color:var(--text2); cursor:pointer; }
.filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
</style>
</head>
<body>

<!-- Login -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div style="font-size:40px;margin-bottom:16px;">👷</div>
    <h2 style="font-size:20px;font-weight:700;margin-bottom:8px;">our tasks ✨✨</h2>
    <p style="font-size:13px;color:var(--text2);margin-bottom:24px;">Qemistry</p>
    <div class="field" style="margin-bottom:12px;text-align:right;">
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:6px;">اسم المستخدم</label>
      <input id="staff-username" type="text" placeholder="username" dir="ltr"
        style="width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:14px;outline:none;"/>
    </div>
    <div class="field" style="margin-bottom:20px;text-align:right;">
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:6px;">كلمة المرور</label>
      <input id="staff-password" type="password" placeholder="••••••••" dir="ltr"
        onkeydown="if(event.key==='Enter')doStaffLogin()"
        style="width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:14px;outline:none;"/>
    </div>
    <button class="btn-primary btn-full" onclick="doStaffLogin()">دخول</button>
    <p id="login-error" style="color:#EF4444;font-size:13px;margin-top:12px;display:none;">بيانات غير صحيحة</p>
  </div>
</div>

<div class="tasks-page" id="tasksPage" style="display:none;">
  <div class="tasks-header">
    <div>
      <h1 style="font-size:20px;font-weight:700;">📋 مهامي</h1>
      <p style="font-size:13px;color:var(--text2);margin-top:4px;" id="staff-welcome">—</p>
    </div>
    <button class="btn-sm danger" onclick="staffLogout()">خروج</button>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterTasks('all', this)">الكل</button>
    <button class="filter-btn" onclick="filterTasks('pending', this)">⏳ معلقة</button>
    <button class="filter-btn" onclick="filterTasks('in-progress', this)">🔄 جاري</button>
    <button class="filter-btn" onclick="filterTasks('completed', this)">✅ منجزة</button>
    <button class="filter-btn" onclick="filterTasks('failed', this)">❌ فشلت</button>
  </div>

  <div id="tasks-list">
    <div style="color:var(--text3);text-align:center;padding:40px;">جاري التحميل...</div>
  </div>
</div>

<div class="status-toast" id="toast"></div>

<script>
const SERVER_URL = window.SERVER_URL;
let staffData  = null;
let staffToken = null;
let allTasks   = [];
let currentFilter = 'all';

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

async function doStaffLogin() {
  const username = document.getElementById('staff-username').value.trim();
  const password = document.getElementById('staff-password').value.trim();
  if (!username || !password) return;

  const res  = await fetch(`${SERVER_URL}/staff/login`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();
  if (data.ok) {
    staffData  = data.staff;
    staffToken = data.token;
    localStorage.setItem('staff_token', data.token);
    localStorage.setItem('staff_data', JSON.stringify(data.staff));
    showStaffPage();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('login-error').textContent   = data.message || 'بيانات غير صحيحة';
  }
}

function showStaffPage() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('tasksPage').style.display    = 'block';
  document.getElementById('staff-welcome').textContent  = 'أهلاً ' + staffData.name + ' 👋';
  loadStaffTasks();
}

function staffLogout() {
  localStorage.removeItem('staff_token');
  localStorage.removeItem('staff_data');
  location.reload();
}

async function loadStaffTasks() {
  const res  = await fetch(`${SERVER_URL}/staff/tasks/${staffData.id}`, {
    headers: { 'authorization': `Bearer ${staffToken}` }
  });
  const data = await res.json();
  allTasks = data.tasks || [];
  renderTasks();
}

function filterTasks(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTasks();
}
  async function loadTaskComments(taskId) {
  const res  = await fetch(`${SERVER_URL}/tasks/${taskId}/comments`, {
    headers: { 'authorization': `Bearer ${staffToken}` }
  });
  const data = await res.json();
  const div  = document.getElementById(`comments-${taskId}`);
  if (!div) return;
  if (!data.comments?.length) { div.innerHTML = ''; return; }
  div.innerHTML = data.comments.map(c => `
    <div style="background:${c.author === 'admin' ? 'rgba(139,92,246,.1)' : 'var(--surface)'};border:1px solid ${c.author === 'admin' ? 'rgba(139,92,246,.3)' : 'var(--border)'};border-radius:8px;padding:8px 12px;margin-bottom:6px;">
      <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">${c.author === 'admin' ? '🛡️ أدمن' : '👷 أنت'} — ${new Date(c.created_at).toLocaleString('ar-QA', { hour:'2-digit', minute:'2-digit', day:'numeric', month:'short', timeZone:'Asia/Qatar' })}</div>
      <div style="font-size:13px;">${c.content}</div>
    </div>
  `).join('');
}

async function addStaffComment(taskId) {
  const input   = document.getElementById(`comment-input-${taskId}`);
  const content = input.value.trim();
  if (!content) return;
  const res  = await fetch(`${SERVER_URL}/tasks/${taskId}/comments`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'authorization': `Bearer ${staffToken}` },
    body: JSON.stringify({ content })
  });
  const data = await res.json();
  if (data.ok) { input.value = ''; loadTaskComments(taskId); }
  else showToast('⚠️ فشل الإرسال');
}

function renderTasks() {
  const filtered = currentFilter === 'all' ? allTasks : allTasks.filter(t => t.status === currentFilter);
  const list = document.getElementById('tasks-list');

  if (!filtered.length) {
    list.innerHTML = '<div style="color:var(--text3);text-align:center;padding:40px;">لا توجد مهام</div>';
    return;
  }

  const statusColor = { 'pending':'#F59E0B', 'in-progress':'#3B82F6', 'completed':'#10B981', 'failed':'#EF4444' };
  const statusLabel = { 'pending':'⏳ معلقة', 'in-progress':'🔄 جاري', 'completed':'✅ منجزة', 'failed':'❌ فشلت' };

  list.innerHTML = filtered.map(task => {
const deadline = task.deadline
  ? new Date(task.deadline).toLocaleString('ar-QA', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', timeZone: 'Asia/Qatar' })
  : '—';
    const color = statusColor[task.status] || '#888';
    const label = statusLabel[task.status] || task.status;
    const isOverdue = task.deadline && new Date(task.deadline) < new Date() && task.status !== 'completed';

    return `
      <div class="task-card" style="border-color:${isOverdue ? '#EF4444' : 'var(--border2)'};">
        <div class="task-card-header">
          <div class="task-title">${task.title} ${isOverdue ? '🔴' : ''}</div>
          <span class="task-status" style="color:${color};background:${color}22;">${label}</span>
        </div>
        <div class="task-meta">📅 ${deadline}</div>
        ${task.description ? `<div class="task-desc">${task.description}</div>` : ''}
        <div style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:6px;">ملاحظاتك / تحديثاتك:</label>
          <textarea id="notes-${task.id}" placeholder="اكتب ما عملته أو أي تحديث..."
            style="width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:13px;resize:none;height:80px;outline:none;">${task.notes || ''}</textarea>
        </div>
        <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">
  <div id="comments-${task.id}" style="margin-bottom:8px;"></div>
  <div style="display:flex;gap:8px;">
    <input id="comment-input-${task.id}" type="text" placeholder="أضف تحديثاً..." 
      style="flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:13px;outline:none;"/>
    <button class="btn-sm" onclick="addStaffComment('${task.id}')">إرسال</button>
  </div>
</div>
        ${task.status !== 'completed' && task.status !== 'failed' ? `
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-sm" onclick="updateTask('${task.id}', 'in-progress')">🔄 جاري التنفيذ</button>
            <button class="btn-sm" style="background:#10B981;border-color:#10B981;" onclick="updateTask('${task.id}', 'completed')">✅ أنجزت</button>
            <button class="btn-sm danger" onclick="updateTask('${task.id}', 'failed')">❌ فشلت</button>
            <button class="btn-sm" onclick="saveNotes('${task.id}', '${task.status}')">💾 حفظ</button>
          </div>` : `
          <div style="display:flex;gap:8px;">
            <button class="btn-sm" onclick="saveNotes('${task.id}', '${task.status}')">💾 حفظ الملاحظات</button>
          </div>`}
      </div>`;
  }).join('');
  setTimeout(() => {
  allTasks.forEach(task => loadTaskComments(task.id));
}, 100);
}

async function updateTask(taskId, status) {
  const notes = document.getElementById(`notes-${taskId}`)?.value || '';
  const res   = await fetch(`${SERVER_URL}/staff/tasks/${taskId}/update`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'authorization': `Bearer ${staffToken}` },
    body: JSON.stringify({ notes, status })
  });
  const data = await res.json();
  if (data.ok) { showToast('✅ تم تحديث المهمة'); loadStaffTasks(); }
  else showToast('⚠️ فشل التحديث');
}

async function saveNotes(taskId, status) {
  const notes = document.getElementById(`notes-${taskId}`)?.value || '';
  const res   = await fetch(`${SERVER_URL}/staff/tasks/${taskId}/update`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'authorization': `Bearer ${staffToken}` },
    body: JSON.stringify({ notes, status })
  });
  const data = await res.json();
  if (data.ok) showToast('✅ تم حفظ الملاحظات');
  else showToast('⚠️ فشل الحفظ');
}

// Auto login
window.addEventListener('load', () => {
  const savedToken = localStorage.getItem('staff_token');
  const savedData  = localStorage.getItem('staff_data');
  if (savedToken && savedData) {
    staffToken = savedToken;
    staffData  = JSON.parse(savedData);
    showStaffPage();
  }
});
</script>
</body>
</html>
